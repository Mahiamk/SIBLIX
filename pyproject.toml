[project]
name = "siblix-monorepo"
version = "1.0.0"
description = "SIBLIX Intelligent Document Processing & Cross-Validation Engine Monorepo"
requires-python = "~=3.12.0"

[tool.pyright]
extraPaths = ["backend", "api"]
