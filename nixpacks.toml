[phases.setup]
nixPkgs = ["python312", "nodejs_22"]

[phases.install]
cmds = [
  "python3 -m venv /opt/venv",
  "/opt/venv/bin/pip install --upgrade pip",
  "/opt/venv/bin/pip install -r backend/requirements.txt",
  "npm --prefix frontend install"
]
paths = ["/opt/venv/bin"]

[phases.build]
cmds = [
  "npm --prefix frontend run build"
]
paths = ["/opt/venv/bin"]

[start]
cmd = "cd backend && (test -f /opt/venv/bin/uvicorn && /opt/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} || python3 -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} || uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000})"
