[phases.setup]
nixPkgs = ["python312", "nodejs_22"]

[phases.install]
cmds = [
  "python3 -m venv .venv",
  ".venv/bin/pip install --upgrade pip",
  ".venv/bin/pip install --no-cache-dir -r backend/requirements.txt",
  "npm --prefix frontend install"
]

[phases.build]
cmds = [
  "npm --prefix frontend run build"
]

[start]
cmd = "cd backend && (test -f ../.venv/bin/uvicorn && ../.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} || test -f /app/.venv/bin/uvicorn && /app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} || test -f .venv/bin/uvicorn && .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} || python3 -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} || uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000})"
