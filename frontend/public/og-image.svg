<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="20%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1E2333" />
      <stop offset="50%" stop-color="#0E121E" />
      <stop offset="100%" stop-color="#07090F" />
    </radialGradient>
    <!-- Badge Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#717486" />
      <stop offset="100%" stop-color="#4B4E5F" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />
  <rect width="1200" height="630" fill="url(#techGrid)" />

  <!-- Ambient glow spheres -->
  <circle cx="200" cy="180" r="260" fill="#38BDF8" opacity="0.07" filter="blur(60px)" />
  <circle cx="1000" cy="450" r="320" fill="#6366F1" opacity="0.08" filter="blur(80px)" />

  <!-- Logo Pill / Header -->
  <g transform="translate(80, 80)">
    <rect width="64" height="64" rx="16" fill="url(#brandGrad)" />
    <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
    <!-- Boat Icon in Logo -->
    <g transform="translate(10, 10) scale(0.171875)">
      <path d="M224,125.77V152c0,56-96,80-96,80s-96-24-96-80V125.77a8,8,0,0,1,5.47-7.59L128,88l90.53,30.18A8,8,0,0,1,224,125.77Z" opacity="0.35" fill="#FFFFFF"/>
      <path d="M221.06,110.59,208,106.23V56a16,16,0,0,0-16-16H136V24a8,8,0,0,0-16,0V40H64A16,16,0,0,0,48,56v50.23l-13.06,4.36A16,16,0,0,0,24,125.77V152c0,61.54,97.89,86.72,102.06,87.76a8,8,0,0,0,3.88,0C134.11,238.72,232,213.54,232,152V125.77A16,16,0,0,0,221.06,110.59ZM64,56H192v44.9L130.53,80.41a8,8,0,0,0-5.06,0L64,100.9Zm152,96c0,24.91-23.68,43-43.55,53.83A228.13,228.13,0,0,1,128,223.72,226.85,226.85,0,0,1,83.81,206C47.6,186.35,40,165.79,40,152V125.77L120,99.1V168a8,8,0,0,0,16,0V99.1l80,26.67Z" fill="#FFFFFF"/>
      <circle cx="128" cy="24" r="14" fill="#38BDF8" />
    </g>

    <!-- Brand Name Text -->
    <text x="80" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">SIBLIX</text>
    <rect x="200" y="16" width="46" height="26" rx="6" fill="rgba(113, 116, 134, 0.25)" stroke="rgba(113, 116, 134, 0.5)" />
    <text x="212" y="34" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#A0A5BA">AI</text>
  </g>

  <!-- Tagline Badge -->
  <g transform="translate(80, 185)">
    <rect width="360" height="34" rx="17" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" />
    <circle cx="18" cy="17" r="4" fill="#38BDF8" />
    <text x="32" y="22" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#38BDF8" letter-spacing="0.5">AUTONOMOUS MARITIME RECONCILIATION</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" fill="#F8FAFC" letter-spacing="-1.5">
    AI Shipping Document Verification
  </text>
  <text x="80" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" fill="url(#cyanGrad)" letter-spacing="-1">
    &amp; Real-Time Discrepancy Auditing
  </text>

  <!-- Subtitle -->
  <text x="80" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94A3B8">
    Reconcile Bills of Lading, Commercial Invoices &amp; Packing Lists in milliseconds.
  </text>
  <text x="80" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#64748B">
    Detect port detention risks, customs mismatched weights &amp; regulatory non-compliance.
  </text>

  <!-- Metric Badges Footer -->
  <g transform="translate(80, 500)">
    <!-- Metric 1 -->
    <rect width="210" height="68" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">&lt; 3.2s</text>
    <text x="20" y="52" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748B">Extraction Latency</text>

    <!-- Metric 2 -->
    <rect x="230" width="210" height="68" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="250" y="32" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#34D399">99.4%</text>
    <text x="250" y="52" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748B">Field Cross-Accuracy</text>

    <!-- Metric 3 -->
    <rect x="460" width="230" height="68" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="480" y="32" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#38BDF8">7 Key Fields</text>
    <text x="480" y="52" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748B">Automated Multi-Way Audit</text>
  </g>
</svg>
